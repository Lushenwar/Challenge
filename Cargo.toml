[package]
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
build = "src/util/build.rs"
default-run = "engineering-challenge"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossbeam = "0.8.4"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
proptest = "1"

[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"

[lints.clippy]
# stdout carries the SBE capture; a stray print corrupts it.
print_stdout = "deny"
dbg_macro = "deny"
