name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs the `starter` tag
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: starter helpers unchanged
        run: git diff --exit-code starter -- src/util sbe_schemas src/side.rs
      - name: no f64 on the data path
        run: "! grep -rnw f64 src --exclude-dir=util"
      - name: venue-neutral outside exchange/
        run: |
          ! grep -rniE 'kalshi|polymarket' src --exclude-dir=exchange
      - name: stdout stays empty (and --help works in a debug build)
        run: |
          cargo run -q -- --help > help.out
          test ! -s help.out
